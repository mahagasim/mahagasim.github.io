<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.title != 'About' %}{{ page.title }} · {% endif %}Maha Gasim</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/learning.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Maha Gasim home">Maha Gasim</a>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/research.html' | relative_url }}"{% if page.title == 'Research Grants' %} class="active"{% endif %}>Research Grants</a>
        <a href="{{ '/teaching.html' | relative_url }}"{% if page.title == 'Teaching' %} class="active"{% endif %}>Teaching</a>
        <a href="{{ '/experience.html' | relative_url }}"{% if page.title == 'Professional Experience' %} class="active"{% endif %}>Professional Experience</a>
        <a href="{{ '/projects.html' | relative_url }}"{% if page.title == 'Selected Analytical Work' %} class="active"{% endif %}>Analytical Work</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <article class="content">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="footer-shell">
      <span>Maha Gasim · Venice, Italy</span>
      <div class="footer-links">
        <a href="mailto:mahagasim@gmail.com">Email</a>
        <a href="https://www.linkedin.com/in/maha-gasim-678975122">LinkedIn</a>
        <a href="https://github.com/mahagasim">GitHub</a>
      </div>
    </div>
  </footer>
</body>
</html>
