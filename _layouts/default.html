<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FDFCFB">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/mg-mark.svg' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/images/mg-mark.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/mg-mark.svg' | relative_url }}">

  <title>{% if page.title and page.title != 'About' %}{{ page.title }} · {% endif %}Maha Gasim</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20260827-1054">
  <style>
    :root {
      --page: #FDFCFB;
      --ink: #292724;
      --muted: #706B64;
      --muted-dark: #4A4641;
      --rule: #E8E2D9;
      --rule-strong: #D8D0C5;

      --heading: #3F5651;
      --heading-deep: #334943;
      --gold: #A9822D;
      --gold-dark: #80611F;
      --gold-soft: #F4EACF;
      --gold-wash: #FBF7EC;
      --blue: #496878;
      --blue-hover: #355868;
      --clay: #956F60;

      --soft-sage: #F5F7F4;
      --soft-blue: #F5F7F8;
      --soft-warm: #FAF6EE;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    ::selection {
      background: var(--gold-soft);
      color: var(--ink);
    }

    code {
      background: #F4F1EC;
    }

    /* A thin gold thread gives the whole site one visual signature. */
    .site-header {
      border-top: 2px solid var(--gold);
      background: rgba(253, 252, 251, 0.96);
    }

    .brand {
      color: var(--heading-deep);
    }

    .site-nav a {
      color: var(--muted-dark);
    }

    .site-nav a:hover {
      color: var(--heading);
      border-bottom-color: var(--gold);
    }

    .site-nav a.active {
      color: var(--heading-deep);
      border-bottom: 2px solid var(--gold);
    }

    /* One strong hierarchy across every tab. */
    .content > h1:first-of-type,
    .section-heading h2,
    .section-heading--compact h2,
    .academic-panel h2,
    .content > h2 {
      color: var(--heading);
    }

    /* Small gold strokes, rather than gold text, carry the decorative energy. */
    .section-heading h2::after,
    .section-heading--compact h2::after,
    .academic-panel h2::after,
    .content > h2::after {
      content: "";
      display: block;
      width: 42px;
      height: 2px;
      margin-top: 10px;
      background: var(--gold);
    }

    .content > h1:first-of-type::after {
      content: "";
      display: block;
      width: 58px;
      height: 3px;
      margin-top: 13px;
      background: var(--gold);
    }

    /* Subtitles stay calm and readable. */
    .interest-item h3,
    .entry h3,
    .paper-entry h3,
    .feature-entry h3,
    .compact-entry h3 {
      color: var(--muted-dark);
    }

    /* Research-interest columns get tiny accent marks, not competing title colours. */
    .interest-item {
      position: relative;
    }

    .interest-item::before {
      content: "";
      display: block;
      width: 24px;
      height: 2px;
      margin-bottom: 12px;
      background: var(--gold);
    }

    .interest-item:nth-child(2)::before {
      background: var(--blue);
    }

    .interest-item:nth-child(3)::before {
      background: var(--heading);
    }

    .compact-detail span,
    .label,
    .languages-line span {
      color: var(--gold-dark);
    }

    a,
    .entry-meta a,
    .contact-line a,
    .footer-links a {
      color: var(--blue);
      text-decoration-color: rgba(73, 104, 120, 0.38);
    }

    a:hover,
    .entry-meta a:hover,
    .contact-line a:hover,
    .footer-links a:hover {
      color: var(--blue-hover);
    }

    .entry-meta,
    .meta-line,
    .project-meta,
    .contact-line,
    .languages-line {
      color: var(--muted);
    }

    .icon-story__lead {
      color: var(--clay);
    }

    .content li::marker {
      color: var(--gold);
    }

    .interest-grid,
    .interest-grid--three {
      border-top-color: var(--rule);
      border-bottom-color: var(--rule);
    }

    .compact-entry,
    .skills-list li,
    .entry,
    .paper-entry,
    .feature-entry {
      border-color: var(--rule);
    }

    /* Give the current paper a quiet journal-like emphasis. */
    .content--research .feature-entry {
      border-left: 3px solid var(--gold);
      padding-left: 22px;
    }

    .content--research .feature-entry h3 {
      color: var(--heading-deep);
    }

    /* A warm ending, still much brighter than the previous footer. */
    .site-footer {
      background: var(--gold-wash);
      border-top-color: var(--gold-soft);
    }

    .footer-identity strong {
      color: var(--heading-deep);
    }

    .analytics-consent {
      background: var(--page);
      border-color: var(--rule-strong);
    }

    .analytics-consent__button {
      background: var(--heading-deep);
      border-color: var(--heading-deep);
    }

    .analytics-consent__button:hover {
      background: var(--gold-dark);
      border-color: var(--gold-dark);
    }

    @media (max-width: 560px) {
      .section-heading h2::after,
      .section-heading--compact h2::after,
      .academic-panel h2::after,
      .content > h2::after {
        width: 34px;
      }

      .content > h1:first-of-type::after {
        width: 46px;
      }

      .content--research .feature-entry {
        padding-left: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Maha Gasim home">
        <img
          class="brand-mark"
          src="{{ '/assets/images/learning-journey-canva.png' | relative_url }}"
          alt="">
        <span class="brand-text">Maha Gasim</span>
      </a>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}"{% if page.title == 'About' %} class="active"{% endif %}>About</a>
        <a href="{{ '/research.html' | relative_url }}"{% if page.title == 'Research' %} class="active"{% endif %}>Research</a>
        <a href="{{ '/teaching.html' | relative_url }}"{% if page.title == 'Teaching' %} class="active"{% endif %}>Teaching</a>
        <a href="{{ '/experience.html' | relative_url }}"{% if page.title == 'Professional Experience' %} class="active"{% endif %}>Professional Experience</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <article class="content content--{{ page.title | slugify }}">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="footer-shell">
      <div class="footer-identity">
        <strong>Maha Gasim</strong>
        <span>Venice, Italy</span>
      </div>
      <div class="footer-note">
        <button class="analytics-preferences" id="analytics-preferences" type="button">Analytics preferences</button>
      </div>
      <div class="footer-links">
        <a href="mailto:mahagasim@gmail.com">Email</a>
        <a href="https://www.linkedin.com/in/maha-gasim-678975122">LinkedIn</a>
        <a href="https://orcid.org/0000-0002-0859-2915" target="_blank" rel="noopener">ORCID</a>
      </div>
    </div>
  </footer>

  <section
    class="analytics-consent"
    id="analytics-consent"
    role="dialog"
    aria-modal="false"
    aria-labelledby="analytics-consent-title"
    aria-describedby="analytics-consent-text"
    hidden>
    <p class="analytics-consent__title" id="analytics-consent-title">Optional website analytics</p>
    <p class="analytics-consent__text" id="analytics-consent-text">
      This site uses Google Analytics only if you allow it, to understand visits and improve the website. Analytics does not load before consent.
    </p>
    <div class="analytics-consent__actions">
      <button class="analytics-consent__button" id="analytics-accept" type="button">Allow analytics</button>
      <button class="analytics-consent__button analytics-consent__button--secondary" id="analytics-reject" type="button">No thanks</button>
    </div>
  </section>

  <script>
    (function () {
      var measurementId = 'G-3TRSNXL6EE';
      var storageKey = 'maha-gasim-analytics-consent';
      var banner = document.getElementById('analytics-consent');
      var acceptButton = document.getElementById('analytics-accept');
      var rejectButton = document.getElementById('analytics-reject');
      var preferencesButton = document.getElementById('analytics-preferences');
      var analyticsLoaded = false;

      function getConsent() {
        try {
          return window.localStorage.getItem(storageKey);
        } catch (error) {
          return null;
        }
      }

      function setConsent(value) {
        try {
          window.localStorage.setItem(storageKey, value);
        } catch (error) {
          // If storage is unavailable, consent applies only to the current page.
        }
      }

      function loadAnalytics() {
        if (analyticsLoaded) return;
        analyticsLoaded = true;

        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () {
          window.dataLayer.push(arguments);
        };

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
        document.head.appendChild(script);

        window.gtag('js', new Date());
        window.gtag('config', measurementId);
      }

      function openBanner() {
        banner.hidden = false;
        acceptButton.focus();
      }

      function closeBanner() {
        banner.hidden = true;
      }

      acceptButton.addEventListener('click', function () {
        setConsent('granted');
        closeBanner();
        loadAnalytics();
      });

      rejectButton.addEventListener('click', function () {
        setConsent('denied');
        closeBanner();
      });

      preferencesButton.addEventListener('click', function () {
        openBanner();
      });

      var consent = getConsent();
      if (consent === 'granted') {
        loadAnalytics();
      } else if (consent !== 'denied') {
        openBanner();
      }
    }());
  </script>
</body>
</html>
