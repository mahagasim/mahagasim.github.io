<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Learning is a continuous journey</title>
  <desc id="desc">Four concentric rings carry the exact 8-bit ASCII binary encoding of LEARNING IS A CONTINUOUS JOURNEY., read from the outer ring inward.</desc>
  <rect width="1000" height="1000" fill="#ffffff"/>

  <defs>
    <path id="outer" d="M500,60 a440,440 0 1,1 -0.1,0"/>
    <path id="ring2" d="M500,170 a330,330 0 1,1 -0.1,0"/>
    <path id="ring3" d="M500,280 a220,220 0 1,1 -0.1,0"/>
    <path id="inner" d="M500,360 a140,140 0 1,1 -0.1,0"/>
  </defs>

  <g fill="none" stroke="#d9e0e5" stroke-width="2">
    <circle cx="500" cy="500" r="440"/>
    <circle cx="500" cy="500" r="330"/>
    <circle cx="500" cy="500" r="220"/>
    <circle cx="500" cy="500" r="140"/>
  </g>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" fill="#17324d" text-anchor="middle">
    <!-- LEARNING + space -->
    <text font-size="20" font-weight="600" letter-spacing="1.1">
      <textPath href="#outer" startOffset="50%">01001100 01000101 01000001 01010010 01001110 01001001 01001110 01000111 00100000</textPath>
    </text>

    <!-- IS A + space -->
    <text font-size="22" font-weight="600" letter-spacing="1.2">
      <textPath href="#ring2" startOffset="50%">01001001 01010011 00100000 01000001 00100000</textPath>
    </text>

    <!-- CONTINUOUS + space -->
    <text font-size="17" font-weight="600" letter-spacing="0.8">
      <textPath href="#ring3" startOffset="50%">01000011 01001111 01001110 01010100 01001001 01001110 01010101 01001111 01010101 01010011 00100000</textPath>
    </text>

    <!-- JOURNEY. -->
    <text font-size="17" font-weight="600" letter-spacing="0.7">
      <textPath href="#inner" startOffset="50%">01001010 01001111 01010101 01010010 01001110 01000101 01011001 00101110</textPath>
    </text>
  </g>

  <circle cx="500" cy="500" r="34" fill="none" stroke="#b59a62" stroke-width="3"/>
  <circle cx="500" cy="500" r="7" fill="#b59a62"/>
</svg>
